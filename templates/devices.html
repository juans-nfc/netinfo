{% extends "base.html" %}
{% block title %} · devices{% endblock %}
{% block content %}
<div class="metrics" id="metrics"></div>
<div class="bar" id="bar"></div>
<div class="barcap" id="barcap"></div>

<div class="controls">
  <button class="tab on" data-f="all" onclick="setFilter(this)">All</button>
  <button class="tab" data-f="windows" onclick="setFilter(this)">Windows</button>
  <button class="tab" data-f="network" onclick="setFilter(this)">Network</button>
  <button class="tab" data-f="printer" onclick="setFilter(this)">Printers</button>
  <button class="tab" data-f="linux" onclick="setFilter(this)">Linux</button>
  <button class="tab" data-f="unknown" onclick="setFilter(this)">Unknown</button>
  <div class="spacer"></div>
  <div class="search"><input id="q" oninput="render()" placeholder="Search host, IP, vendor"></div>
</div>

<div class="panel">
  <table>
    <thead><tr>
      <th style="width:96px">Status</th><th style="width:190px">Device</th>
      <th style="width:90px">Type</th><th style="width:200px">Hardware</th>
      <th style="width:150px">OS</th><th style="width:46px" class="center">AD</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No devices match.</div>
</div>

<div class="detail" id="detail" style="display:none"></div>
{% endblock %}

{% block script %}
<script>
const TYPE_PILL={windows:'p-accent',network:'p-pro',printer:'p-warning',linux:'p-success',unknown:'p-plain'};
let DEVICES=[], curFilter='all';

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function load(){
  const stats=await (await fetch('/api/stats')).json();
  DEVICES=await (await fetch('/api/devices')).json();
  document.getElementById('metrics').innerHTML=[
    ['Total devices',stats.total,''],
    ['In AD · online',stats.ad_online,'s-online'],
    ['In AD · silent',stats.ad_silent,'s-silent'],
    ['Not in AD',stats.not_ad,'s-unknown'],
  ].map(m=>`<div class="metric"><div class="lbl">${m[0]}</div><div class="val ${m[2]}">${m[1]}</div></div>`).join('');
  const tot=Math.max(stats.ad_online+stats.ad_silent+stats.not_ad,1);
  const pct=n=>(100*n/tot).toFixed(1)+'%';
  document.getElementById('bar').innerHTML=
    `<span style="width:${pct(stats.ad_online)};background:var(--fill-success)"></span>`+
    `<span style="width:${pct(stats.ad_silent)};background:var(--fill-warning)"></span>`+
    `<span style="width:${pct(stats.not_ad)};background:var(--fill-accent)"></span>`;
  document.getElementById('barcap').textContent=
    `Reconciliation: ${stats.ad_online} domain PCs answered, ${stats.ad_silent} in AD but silent, ${stats.not_ad} responded but not domain computers`;
  render();
}
function setFilter(b){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));b.classList.add('on');curFilter=b.dataset.f;render();}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const rows=DEVICES.filter(d=>{
    const okT=curFilter==='all'||d.device_type===curFilter;
    const hay=(d.hostname||'')+' '+(d.ip||'')+' '+(d.vendor||'')+' '+(d.model||'');
    return okT && (!q||hay.toLowerCase().includes(q));
  });
  const st={online:['s-online','Online'],silent:['s-silent','Silent'],unknown:['s-unknown','Online']};
  document.getElementById('tbody').innerHTML=rows.map(d=>{
    const s=st[d.status]||st.unknown, pill=TYPE_PILL[d.device_type]||'p-plain';
    const ipline=esc(d.ip||'—')+(d.status==='silent'?' <span class="sub">· not responding</span>':'');
    return `<tr class="row" onclick="showDetail('${encodeURIComponent(d.ip)}')">
      <td><span class="stat ${s[0]}"><span class="dot"></span>${d.status==='silent'?'Silent':'Online'}</span></td>
      <td><div>${esc(d.hostname||'—')}</div><div class="sub">${ipline}</div></td>
      <td><span class="pill ${pill}">${esc(d.device_type||'?')}</span></td>
      <td>${esc([d.vendor,d.model].filter(Boolean).join(' ')||'—')}</td>
      <td>${esc(d.os_name||d.ad_os||'—')}</td>
      <td class="center">${d.in_ad?'<span class="s-online">✓</span>':'<span class="muted">—</span>'}</td>
    </tr>`;}).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
}
async function showDetail(ipEnc){
  const d=await (await fetch('/api/device/'+ipEnc)).json();
  const mem=d.memory_mb?Math.round(d.memory_mb/1024)+' GB':'—';
  const facts=[['IP',d.ip],['MAC',d.mac],['Serial',d.serial],['CPU',d.cpu],['Memory',mem],
    ['Collected via',d.source],['First seen',d.first_seen],['Last seen',d.last_seen]]
    .map(f=>`<tr><td class="muted">${f[0]}</td><td>${esc(f[1]||'—')}</td></tr>`).join('');
  const ports=(d.ports||[]).length?d.ports.map(p=>`<span class="pill p-plain mono">${p.port}</span>`).join(' '):'<span class="muted">none observed</span>';
  const sw=(d.software||[]);
  const swlist=sw.length?sw.slice(0,12).map(s=>`<tr><td>${esc(s.name)}</td><td class="mono muted">${esc(s.version||'')}</td></tr>`).join(''):'<tr><td class="muted">no software collected</td></tr>';
  const swmore=sw.length>12?`<div class="note">…and ${sw.length-12} more</div>`:'';
  document.getElementById('detail').innerHTML=
    `<div style="display:flex;justify-content:space-between;align-items:flex-start">
       <div><h3>${esc(d.hostname||d.ip)}</h3><div class="sub">${esc([d.vendor,d.model].filter(Boolean).join(' '))} · ${esc(d.os_name||d.ad_os||'')}</div></div>
       <button class="btn" onclick="document.getElementById('detail').style.display='none'">Close</button></div>
     <div style="margin:10px 0">${d.in_ad?'<span class="pill p-success">In AD</span>':'<span class="pill p-plain">Not in AD</span>'}</div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 32px">
       <table class="facts">${facts}</table>
       <div>
         <div class="sub" style="margin-bottom:6px">Open ports</div><div>${ports}</div>
         <div class="sub" style="margin:14px 0 6px">Software (${sw.length})</div>
         <table class="facts">${swlist}</table>${swmore}
       </div>
     </div>`;
  document.getElementById('detail').style.display='block';
  document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}
window.reload=load;
load();
</script>
{% endblock %}
